      <rect x="566" y="248" width="36" height="22" rx="2" fill="#FADF86"/>
      <path d="M566 255 H602 M566 262 H602" stroke="#E5BE55" stroke-width="1"/>
      <line x1="652" y1="270" x2="652" y2="238" stroke="#4A5A9C" stroke-width="3"/>
      <ellipse cx="652" cy="232" rx="14" ry="6" fill="#9AA8D2" transform="rotate(-30 652 232)"/>
